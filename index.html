<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의날씨알리미</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Eric Meyer CSS Reset -->
    <link rel="stylesheet" href="./css/reset.css">

    <!-- 사용자 정의 스타일 -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./js/script.js"></script>
</head>

<body data-weather="sunny">
    <!-- id 속성의 식별자 작성 명명  -->
    <!--  - kebab : CSS 에서 사용할 요소 -->
    <!--  - camel : JS 에서 사용할 요소 -->

    <!-- 공통 헤더 -->
    <section class="hero-photo">
        <div class="hero-inner">
            <h1 class="hero-title">오늘의 날씨 알리미 페이지</h1>
            <form action="" id="searchForm" class="search-form">
                <input type="text" id="cityInput" placeholder="도시 이름 검색(예시:광주)" autocomplete="off">
                <button type="submit">검색</button>
            </form>
        </div>
    </section>


    <div id="screen-home" class=" screen" hidden>
        <div class="page-content">
            <div class="page-content-inner">
                <div class="home-top">
                    <section id="mylocation" class="my-location">
                        <button type="button" id="mylocationBtn" class="my-location-btn">
                            🌈내 위치 날씨 보기
                        </button>
                        <p class="my-location-hint">
                            위치를 허용하면 내 동내의 현재 날씨가 여기의 나타납니다.
                        </p>
                    </section>

                    <div class="home-top-right">
                        <h2 class="section-title"> 오늘의 전국 최고/최저</h2>
                        <div id="extremRow" class="extream-row">
                            <button type="button" class="extream-card">
                                <span class="extream-lable">🔥오늘 가장 더운 곳</span>
                                <span class="extream-vaule">강릉 39℃</span>
                            </button>

                            <button type="button" class="extream-card">
                                <span class="extream-lable">❄️오늘 가장 추운 곳</span>
                                <span class="extream-vaule">대전 23℃</span>
                            </button>
                        </div>
                    </div>
                </div>

                <h2 class="section-title">주요 도시 날씨</h2>

                <div id="cityList" class="city-list">

                    <button type="button" class="city-row">
                        <span class="city-row-name">서울</span>
                        <span class="city-row-weather">
                            <img src="./icons/rain.svg" alt="" class="city-row-icon">
                            <span class="city-row-temp">28℃</span>
                            <span class="city-row-chevron"></span>
                        </span>
                    </button>

                    <button type="button" class="city-row">
                        <span class="city-row-name">서울</span>
                        <span class="city-row-weather">
                            <img src="./icons/rain.svg" alt="" class="city-row-icon">
                            <span class="city-row-temp">28℃</span>
                            <span class="city-row-chevron"></span>
                        </span>
                    </button>

                    <button type="button" class="city-row">
                        <span class="city-row-name">서울</span>
                        <span class="city-row-weather">
                            <img src="./icons/rain.svg" alt="" class="city-row-icon">
                            <span class="city-row-temp">28℃</span>
                            <span class="city-row-chevron"></span>
                        </span>
                    </button>
                </div>
                <div class="footer-home">
                    <p>Data by <a href="https://open-meteo.com" target="_blank">Open-Meteo</a></p>
                    <p>순천효산고 김한결</p>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-detail" class="screen screen-detail">
        <header class="detail-header">
            <button type="button" id="backBtn" class="back-btn"> 목록으로</button>
        </header>
        <div class="app">
            <main>
                <p id="statusMsg" class="status-msg" role="status" hidden>
                    날씨 정보를 불러오는 중....
                </p>

                <div id="tabBar" class="tab-bar" role="tablist">
                    <button type="button" class="tab-btn active" data-tab="summary" role="tab" aria-selected="true">주간별
                        날씨</button>
                    <button type="button" class="tab-btn" data-tab="hourly" role="tab" aria-selected="false">시간별
                        날씨</button>
                </div>

                <div id="panel-summary" class="tab-pannel" role="tabpanel">
                    <section id="currentcard" class="current-card">
                        <div id="currentContent" class="current-content">
                            <h2 id="locationName" class="location">도시 이름</h2>
                            <p id="updatedTime" class="updated">-</p>


                            <div class="temp-row">
                                <img src="" alt="" id="weatherIcon" class=" weather-icon">
                                <span id="temperature" class="temp">--°</span>
                            </div>
                            <p id="weatherDesc" class="desc">맑음</p>

                            <div class="sub-info">
                                <div class="sub-item">
                                    <span class="sub-label">체감</span>
                                    <span id="feelslike">--°</span>
                                </div>
                                <div class="sub-item">
                                    <span class="sub-label">습도</span>
                                    <span id="humidity">--%</span>
                                </div>
                                <div class="sub-item">
                                    <span class="sub-label">풍속</span>
                                    <span id="windspeed">--km/h</span>
                                </div>
                                <div class="sub-item">
                                    <span class="sub-label">강수확률</span>
                                    <span id="preciprob">-%</span>
                                </div>
                            </div>


                            <div id="sunInfo" class="sun-info">
                                <span>일출🌍<span id="sunriseTime">--:--</span></span>
                                <span>일몰🦄<span id="sunsetTime">--:--</span></span>
                            </div>

                            <div id="airInfo" class="air-info">
                                <div id="pm100Badge" class="air-badge grade-good">미세먼지 좋음</div>
                                <div id="pm25badge" class="air-badge grade-bad">초미세먼지 나쁨</div>

                            </div>
                        </div>
                    </section>
                    <section id="forecastRow" class="forecast-row"></section>
                </div>
                </section>
                <div id="panel-hourly" class="tab-pannel" role="tabpannel" hidden>
                    <section class="hourly-list-card">
                        <div id="hourlyList" class="hourly-list">

                        </div>
                    </section>
                </div>
            </main>
        </div>

        <div class="footer-detail">
            <p>Data by <a href="https://open-meteo.com" target="_blank">Open-Meteo</a></p>
            <p>순천효산고 김한결</p>

        </div>
    </div>


</body>

</html>
